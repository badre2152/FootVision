services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: football_minio2152
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER:     minioadmin2152
      MINIO_ROOT_PASSWORD: minioadmin2152
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: football_minio_init2152
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin2152 minioadmin2152;
      mc mb --ignore-existing local/football-bronze;
      mc mb --ignore-existing local/football-silver;
      mc mb --ignore-existing local/football-gold;
      echo 'Buckets created: football-bronze, football-silver, football-gold';
      "
    restart: "no"

volumes:
  minio_data:
    driver: local