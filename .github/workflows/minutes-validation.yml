name: Minutes validation regression

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  minutes-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pandas
      - name: Compile source and tests
        run: python -m compileall -q analytics/scoring/minutes_filter.py tests/analytics/scoring/test_minutes_validation.py
      - name: Run minute validation tests
        run: python -m unittest discover -s tests/analytics/scoring -p test_minutes_validation.py -v
